name: Benchmarking

# Not running because this file is not on the default branch
# on:
#   workflow_run:
#     workflows: [Run tests]
#     types:
#       - completed

on:
  pull_request:
    branches: [ main ]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run benchmarck (baseline)
        run: cargo bench
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Run benchmarck (changes)
        run: cargo bench | tee output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: output.txt
